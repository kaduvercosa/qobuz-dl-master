name: CI

# "lint": roda o flake8 (usa o .flake8 do repo) sobre qobuz_dl/.
#
# "tests": roda a suíte de testes automatizada (tests/test_*.py). Os
# testes marcados "slow" (abrem subprocesso real do programa) ficam de
# fora por padrão pra manter o CI rápido -- rode-os manualmente com
# `pytest -m slow` quando precisar.
#
# tests/manual/ (ex.: verificar_letras.py) fica DE FORA de propósito:
# exige login real no Qobuz e acesso à internet, não é coletado pelo
# pytest (não tem prefixo "test_"), e não faz sentido em CI. Ver
# tests/manual/README.md.

on:
  push:
    branches: ["master", "main"]
  pull_request:
    branches: ["master", "main"]
  workflow_dispatch:

jobs:
  lint:
    name: Flake8
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instala flake8
        run: python -m pip install --upgrade pip flake8

      - name: Roda flake8 (usa o .flake8 do repo)
        run: flake8 qobuz_dl

  tests:
    name: Testes (pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instala o projeto com as dependências de dev
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Roda a suíte de testes (pula os marcados "slow")
        run: pytest -m "not slow" -q
