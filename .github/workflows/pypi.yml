name: Publish to PyPI

on:
  release:
    types: [published]
  # Botão manual para publicar sem precisar criar uma release no GitHub.
  workflow_dispatch:
    inputs:
      manual_version:
        description: 'Versão a forçar no PyPI (ex.: 2.5.2)'
        required: true
        default: '2.5.2'

jobs:
  # Roda a MESMA suíte de tests.yml antes de publicar -- sem isso, uma
  # release com testes quebrados ainda subia pro PyPI normalmente, já que
  # `release: published` não tinha nenhuma relação com o resultado do CI.
  testes:
    uses: ./.github/workflows/tests.yml

  pypi-publish:
    name: Build and publish to PyPI
    needs: testes
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
    - name: Checkout do código
      uses: actions/checkout@v7

    - name: Setup Python 3.12
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'

    - name: Extrai a versão
      id: extract_version
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          VERSION="${{ github.event.inputs.manual_version }}"
        else
          VERSION=${GITHUB_REF_NAME#v}
        fi
        echo "VERSION=$VERSION" >> $GITHUB_ENV
        echo "Versão que será injetada: $VERSION"

    - name: Instala as ferramentas de build
      run: python -m pip install --upgrade pip build

    - name: Compila o pacote
      run: python -m build

    - name: Publica no PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
