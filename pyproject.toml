[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qobuz-dl-ultra"
dynamic = ["version"]
description = "Versão Ultra de downloads de música do Qobuz, Lossless com metadados ReplayGain e Classical"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }

authors = [
    { name = "Eduardo (kaduvercosa)", email = "kaduvercosa@users.noreply.github.com" }
]

keywords = [
    "qobuz",
    "music",
    "downloader",
    "flac",
    "hi-res",
    "lossless"
]

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: GNU General Public License (GPL)",
    "Operating System :: OS Independent"
]

dependencies = [
    "pathvalidate",
    "httpx",
    "aiosqlite",
    "send2trash",
    "humanize",
    "aiofiles",
    "tenacity",
    "platformdirs",
    "charset_normalizer",
    "mutagen",
    "tqdm",
    "questionary",
    "prompt_toolkit",
    "packaging",
    "colorama>=0.4.6",
    "cryptography",
    "keyring",
]

[project.optional-dependencies]
speed = [
    "rapidfuzz",
    "brotli",
]
covers = [
    "Pillow>=10.0.0",
]
watch = [
    "watchdog",
]
duplicates = [
    "pyacoustid",
]
genius = [
    "lyricsgenius>=3.0; python_version >= '3.11'",
    "lyricsgenius>=3.0,<3.7.4; python_version < '3.11'",
]
analyze = [
    "numpy",
]
all = [
    "qobuz-dl-ultra[speed,covers,watch,duplicates,genius,analyze]",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-httpx>=0.30",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/kaduvercosa/qobuz-dl-ultra"
Repository = "https://github.com/kaduvercosa/qobuz-dl-ultra"
Issues = "https://github.com/kaduvercosa/qobuz-dl-ultra/issues"

[project.scripts]
qobuz-dl = "qobuz_dl:main"
qdl = "qobuz_dl:main"

[tool.setuptools.dynamic]
version = { attr = "qobuz_dl.__version__" }

[tool.setuptools.packages.find]
include = ["qobuz_dl*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]

norecursedirs = ["manual", ".git", "__pycache__", "build", "dist"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "slow: abre subprocesso do programa; mais lento que os testes de unidade",
]

asyncio_mode = "auto"

# Ruff >= 0.2.x exige que select/ignore fiquem em [tool.ruff.lint]
# e removeu regras como W503/W504 que conflitam com formatadores.
#
# Esta config espelha o .flake8 atual, menos as regras inexistentes no Ruff.

[tool.ruff]
target-version = "py310"  # matches requires-python = ">=3.10"
line-length = 88

[tool.ruff.lint]
# Regras ativas: pycodestyle (E, W), Pyflakes (F),
# flake8-bugbear (B), mccabe (C), flake8-print (T)
select = [
  "E", "W", "F", "B", "C", "T",
]

# Ignorar regras equivalentes ao .flake8, exceto W503/W504 que nao existem mais
lint.ignore = [
  "E203", "E266", "E501",        # whitespace / line-length
  "W291", "W293",                # trailing whitespace / blank line whitespace
  "E226", "E731", "E741",        # whitespace around operators / lambda / ambig names
  "F541", "F841", "E402",        # f-string sem placeholders / variavel nao usada / import fora do topo
  "C901",                        # complexidade (controlada via mccabe abaixo)
  "B907", "B950", "B905",        # bugbear especificas
  "C414", "C408",                # comprehensions
  "E128",                        # indentation de linhas quebradas
  # W503 e W504 NAO existem mais no Ruff - removidos
]

# Complexidade maxima (equivalente ao max-complexity = 55 do flake8)
[tool.ruff.lint.mccabe]
max-complexity = 55

# Permite fix automatico para tudo (quando rodar --fix)
[tool.ruff.lint]
fixable = ["ALL"]
unfixable = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
